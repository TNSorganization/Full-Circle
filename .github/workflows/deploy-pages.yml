# Sync the verified 24 November 2026 Instructor Insights and quarterly rewards release.
# Trigger mirror publication after verified secure Fapshi checkout fallback build.
name: Keep Full Circle Online

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: full-circle-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the recovery repository
        uses: actions/checkout@v4

      - name: Fetch the latest verified production build
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/Partner700/Fullcircle.git source
          git -C source sparse-checkout set dist

          test -f source/dist/index.html
          test -f source/dist/fc-worker.js
          test -f source/dist/offline.html
          test -f source/dist/release-manifest.json
          test -d source/dist/assets
          node --check source/dist/fc-worker.js
          node --check source/dist/sw.js

          mkdir release
          cp -R source/dist/. release/
          for splash in release/icons/apple-splash-*.png; do
            test -e "$splash" || continue
            cp deploy-assets/pwa-splash.png "$splash"
          done
          cp release/index.html release/404.html
          touch release/.nojekyll

          expected="$(sed -n 's#.*src="\(\./assets/index-[^"]*\.js\)".*#\1#p' release/index.html | head -n 1)"
          test -n "$expected"
          test -f "release/${expected#./}"
          ! grep -R -Fq 'kckzqsafzemeijxfohuy' release
          grep -Fq 'ovusyeqbmtvfcrlflrbf' "release/${expected#./}"

      - name: Check if this release is already live
        id: release_check
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(tr -d '\r\n' < release/.fullcircle-source-sha)"
          deployed="$(curl -fsSL --retry 1 --connect-timeout 4 --max-time 12 \
            -H 'Cache-Control: no-cache' \
            'https://tnsorganization.github.io/Full-Circle/.fullcircle-source-sha' 2>/dev/null || true)"
          deployed="$(printf '%s' "$deployed" | tr -d '\r\n')"
          if [ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ] && [ -n "$expected" ] && [ "$deployed" = "$expected" ]; then
            echo "Release $expected is already live; no upload necessary."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing source release $expected."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.release_check.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the verified app
        if: steps.release_check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: release
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for Pages artifact indexing
        if: steps.release_check.outputs.deploy == 'true'
        run: sleep 25

      - name: Deploy the app
        if: steps.release_check.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
