name: Keep Full Circle Online

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: full-circle-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the recovery repository
        uses: actions/checkout@v4

      - name: Fetch the latest verified production build
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/Partner700/Fullcircle.git source
          git -C source sparse-checkout set dist

          test -f source/dist/index.html
          test -f source/dist/fc-worker.js
          test -f source/dist/release-manifest.json
          test -d source/dist/assets

          mkdir release
          cp -R source/dist/. release/
          for splash in release/icons/apple-splash-*.png; do
            test -e "$splash" || continue
            cp deploy-assets/pwa-splash.png "$splash"
          done
          cp release/index.html release/404.html
          touch release/.nojekyll

          expected="$(sed -n 's#.*src="\(\./assets/index-[^"]*\.js\)".*#\1#p' release/index.html | head -n 1)"
          test -n "$expected"
          test -f "release/${expected#./}"
          ! grep -R -Fq 'kckzqsafzemeijxfohuy' release
          grep -R -Fq 'nffqohxdelaglrmuzjwb' release

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the verified app
        uses: actions/upload-pages-artifact@v3
        with:
          path: release

      - name: Deploy the app
        id: deployment
        uses: actions/deploy-pages@v4
