name: Build and publish current Full Circle
run-name: Publish latest canonical Full Circle source

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: full-circle-current-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Publish 25 November reliability preflight: room-scoped heartbeats and witness lock repair.
      - name: Checkout canonical Full Circle source
        uses: actions/checkout@v4
        with:
          repository: Partner700/Fullcircle
          ref: main
          path: source
          persist-credentials: false

      - name: Record canonical source version
        id: source
        working-directory: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked application dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        working-directory: source
        run: npm run typecheck

      - name: Validate isolated staging load-test scripts
        working-directory: source
        run: |
          node --check scripts/full-circle-staging-login-concurrency.mjs
          node --check scripts/full-circle-staging-arena-witness-concurrency.mjs

      - name: Verify login and Arena reliability preflight
        working-directory: source
        run: node scripts/login-arena-reliability-preflight.test.cjs

      - name: Verify mobile storage resilience
        working-directory: source
        run: node --experimental-strip-types scripts/mobile-runtime-resilience.test.ts

      # Check current release before publishing new Bible editorial categories and Arena witness reactions.
      - name: Verify startup and offline recovery
        working-directory: source
        run: node scripts/startup-resilience.test.cjs

      - name: Verify Journey winner and scoring rules
        working-directory: source
        run: node --experimental-strip-types scripts/biblical-journey.test.ts

      - name: Verify two Scripture discoveries for every Bible chapter
        working-directory: source
        run: node --experimental-strip-types scripts/chapter-discovery-coverage.test.ts

      - name: Build current application from source
        working-directory: source
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          test -s source/dist/index.html
          cp source/dist/index.html source/dist/404.html
          touch source/dist/.nojekyll
          echo "${{ steps.source.outputs.sha }}" > source/dist/full-circle-source-sha.txt
          test -s source/dist/fc-worker.js
          grep -q 'full-circle-release" content="304"' source/dist/index.html
          grep -q "full-circle-target-v304" source/dist/fc-worker.js

      - name: Verify compiled application and source identity
        working-directory: source
        run: |
          test -s dist/index.html
          test -s dist/full-circle-source-sha.txt
          test -d dist/assets
          find dist/assets -maxdepth 1 -name '*.js' -size +0c | grep -q .
          echo "Verified application assets and canonical source identity"

      - name: Publish independent GitHub Pages mirror
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./source/dist
          force_orphan: false
          keep_files: false
          commit_message: 'Publish verified Full Circle source ${{ steps.source.outputs.sha }}'
