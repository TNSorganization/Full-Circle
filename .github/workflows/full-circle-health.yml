name: Full Circle production health watch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-circle-health.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: full-circle-health-watch
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public Supabase Auth and REST availability
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: https://ovusyeqbmtvfcrlflrbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_HeGFIazo0kNZ53gf1eKuRA_bpfKORje
        with:
          script: |
            const base = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_PUBLISHABLE_KEY;
            const checks = [
              { name: 'Auth', url: base + '/auth/v1/health', headers: { apikey: key } },
              { name: 'REST', url: base + '/rest/v1/', headers: { apikey: key } },
            ];
            const results = [];
            for (const check of checks) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 12000);
              try {
                const started = Date.now();
                const response = await fetch(check.url, { headers: check.headers, signal: controller.signal });
                const latency = Date.now() - started;
                // A healthy root PostgREST endpoint may be authorization-gated.
                // Gateway-level 500/502/503/504 and timeouts are definite failures.
                const ok = check.name === 'Auth'
                  ? response.status >= 200 && response.status < 300
                  : response.status < 500 && response.status !== 429;
                results.push({ name: check.name, status: response.status, latency, ok });
              } catch (error) {
                results.push({ name: check.name, ok: false, error: String(error).slice(0, 150) });
              } finally {
                clearTimeout(timeout);
              }
            }
            const detail = results.map(r => JSON.stringify(r)).join('\n');
            core.info(detail);
            const { owner, repo } = context.repo;
            const title = 'Full Circle production health outage';
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const openIssue = issues.data.find(issue => !issue.pull_request && issue.title === title);
            const unhealthy = results.some(r => !r.ok);
            if (!unhealthy) {
              if (openIssue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: openIssue.number,
                  body: 'Automated public Auth/REST checks recovered at ' + new Date().toISOString() + '. Login still requires a real-user check.' });
                await github.rest.issues.update({ owner, repo, issue_number: openIssue.number, state: 'closed' });
              }
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'full-circle-health.yml', per_page: 10,
            });
            const previous = runs.data.workflow_runs.find(run => run.id !== context.runId && run.status === 'completed');
            if (!openIssue && previous?.conclusion === 'failure') {
              await github.rest.issues.create({ owner, repo, title,
                body: 'Two consecutive public Supabase endpoint checks failed.\n\n' + detail
                  + '\n\nVerify Supabase logs for project ovusyeqbmtvfcrlflrbf, Auth /token, connection pool and database performance. Do not reset user sessions or charge Arena players again without evidence.' });
            }
            core.setFailed('Full Circle health check failed: ' + detail);
