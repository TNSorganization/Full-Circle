    html,body,#root{min-height:100%;margin:0;background:#0f2037;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

  <script>
    // The app is also opened inside older Android and social-app WebViews.
    // Supply the small ES2019/2020 helpers used by the release bundles.
    if (!Array.prototype.flatMap) {
      Object.defineProperty(Array.prototype, 'flatMap', {
        configurable: true,
        writable: true,
        value: function (callback, thisArg) {
          return this.reduce(function (result, item, index, array) {
            return result.concat(callback.call(thisArg, item, index, array));
          }, []);
        }
      });
    }
    if (!Object.fromEntries) {
      Object.fromEntries = function (entries) {
        return Array.from(entries).reduce(function (result, entry) {
          result[entry[0]] = entry[1];
          return result;
        }, {});
      };
    }
    if (!String.prototype.matchAll) {
      Object.defineProperty(String.prototype, 'matchAll', {
        configurable: true,
        writable: true,
        value: function (expression) {
          if (!(expression instanceof RegExp) || !expression.global) {
            throw new TypeError('String.prototype.matchAll requires a global RegExp');
          }
          var source = String(this);
          var matcher = new RegExp(expression.source, expression.flags);
          var matches = [];
          var match;
          while ((match = matcher.exec(source)) !== null) {
            matches.push(match);
            if (match[0] === '') matcher.lastIndex += 1;
          }
          return matches;
        }
      });
    }
    if (!Promise.allSettled) {
      Promise.allSettled = function (promises) {
        return Promise.all(Array.from(promises).map(function (promise) {
          return Promise.resolve(promise).then(
            function (value) { return { status: 'fulfilled', value: value }; },
            function (reason) { return { status: 'rejected', reason: reason }; }
          );
        }));
      };
    }
  </script>

  <script>
    // Some older home-screen shortcuts were saved with a www hostname. Once
    // that hostname reaches Hostinger, move it to the single supported origin
    // before loading the manifest, worker, fonts, or application bundle.
    if (window.location.hostname.toLowerCase() === 'www.fullcircle.partnertai.com') {
      var canonicalUrl = new URL(window.location.href);
      canonicalUrl.protocol = 'https:';
      canonicalUrl.hostname = 'fullcircle.partnertai.com';
      canonicalUrl.port = '';
      window.location.replace(canonicalUrl.toString());
    }
    // A retired shortcut or malformed notification must never leave a user on
    // a JavaScript/CSS document. When an SPA host returns this shell for such a
    // navigation, immediately restore the real application route.
    if (/\/assets\/|\.(?:js|mjs|css|json|map)$/i.test(window.location.pathname)) {
      var assetSegment = window.location.pathname.toLowerCase().lastIndexOf('/assets/');
      var appPath = assetSegment >= 0
        ? window.location.pathname.slice(0, assetSegment + 1)
        : window.location.pathname.slice(0, window.location.pathname.lastIndexOf('/') + 1);
      var appUrl = new URL(appPath || '/', window.location.origin);
      appUrl.searchParams.set('fc-asset-recovery', '178');
      window.location.replace(appUrl.toString());
    }
  </script>

  <!-- Release-aware recovery for installed and in-browser copies. -->
  <title>Full Circle</title>
  <script>
    // A pre-migration worker may still control an installed phone. Keep normal
    // updates quiet, but let an explicit retry verify the network and replace
    // every Full Circle shell cache that could be trapping the phone.
    (function () {
      var release = '178';
      var currentCachePrefix = 'full-circle-target-v178';
      var marker = 'fc-repair';
      var repairStarted = false;
      var mirrorStarted = false;
      var styleAttempt = 0;
      var styleTimer = 0;
      window.__fullCircleBootRelease = release;
      window.__fullCircleStylesReady = false;

      window.__showFullCircleRecovery = function () {
        var show = function () {
          var root = document.getElementById('root');
          if (!root || root.dataset.fcAppMounted === 'true') return;
          root.innerHTML = '<div data-fc-recovery-shell><div><p style="font-size:16px;font-weight:800">Full Circle is reconnecting.</p><p style="margin-top:9px;color:#cbd5e1;font-size:13px;line-height:1.5">Your account and progress are safe.</p><button data-fc-retry type="button" onclick="window.__repairFullCircleBoot(true)">Try Again</button><p style="margin-top:14px;color:#94a3b8;font-size:11px">Release ' + release + '</p></div></div>';
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, { once: true });
        else show();
      };

      window.__markFullCircleStylesReady = function (link) {
        window.requestAnimationFrame(function () {
          var markerValue = window.getComputedStyle(document.documentElement)
            .getPropertyValue('--full-circle-release-style')
            .replace(/["']/g, '')
            .trim();
          if (markerValue !== release) {
            window.__loadFullCircleStyleMirror(link);
            return;
          }
          window.clearTimeout(styleTimer);
          window.__fullCircleStylesReady = true;
          document.documentElement.dataset.fcStylesReady = release;
          window.dispatchEvent(new CustomEvent('fullcircle:styles-ready', { detail: { release: release } }));
        });
      };

      window.__loadFullCircleStyleMirror = function (failedLink) {
        var link = failedLink || document.querySelector('link[data-full-circle-release-styles]');
        if (!link || window.__fullCircleStylesReady) return;
        window.clearTimeout(styleTimer);
        if (!link.dataset.fcStylePrimary) link.dataset.fcStylePrimary = link.href;
        var baseUrl = new URL('.', link.dataset.fcStylePrimary);
        var candidates = [
          new URL('full-circle-release.css?fc-style=' + release + '-' + Date.now(), baseUrl).href,
          'https://cdn.jsdelivr.net/gh/TNSorganization/Full-Circle@gh-pages/full-circle-release.css?v=' + release,
          'https://raw.githack.com/TNSorganization/Full-Circle/gh-pages/full-circle-release.css?v=' + release
        ];
        if (styleAttempt >= candidates.length) {
          window.__showFullCircleRecovery();
          return;
        }
        link.href = candidates[styleAttempt++];
        styleTimer = window.setTimeout(function () {
          window.__loadFullCircleStyleMirror(link);
        }, 6000);
      };

      function releaseFromDocument(html) {
        var tags = String(html || '').match(/<meta\b[^>]*>/gi) || [];
        for (var index = 0; index < tags.length; index += 1) {
          if (!/\bname=["']full-circle-release["']/i.test(tags[index])) continue;
          var match = tags[index].match(/\bcontent=["'](\d+)["']/i);
          return match ? Number(match[1]) : 0;
        }
        return 0;
      }

      async function verifiedNetworkShell() {
        var appBaseUrl = new URL('./', window.location.href);
        var probeUrl = new URL('index.html', appBaseUrl);
        probeUrl.searchParams.set('fc-connectivity', release);
        probeUrl.searchParams.set('ts', String(Date.now()));
        var response = await Promise.race([
          fetch(probeUrl.href, { cache: 'no-store', headers: { Accept: 'text/html' } }),
          new Promise(function (_, reject) {
            window.setTimeout(function () { reject(new Error('Connection timed out.')); }, 15000);
          })
        ]);
        if (!response || !response.ok) return false;
        var contentType = response.headers.get('content-type') || '';
        if (!/text\/html|application\/xhtml\+xml/i.test(contentType)) return false;
        var html = await response.text();
        return releaseFromDocument(html) >= Number(release) && /id=["']root["']/.test(html);
      }

      window.__repairFullCircleBoot = async function (force) {
        if (repairStarted) return;
        repairStarted = true;

        var retryButton = document.querySelector('[data-fc-retry]');
        if (retryButton) {
          retryButton.disabled = true;
          retryButton.textContent = 'Reconnecting...';
        }

        try {
          if ('serviceWorker' in navigator) {
            var registration = await navigator.serviceWorker.getRegistration().catch(function () { return null; });
            if (registration) {
              await Promise.race([
                registration.update().catch(function () {}),
                new Promise(function (resolve) { window.setTimeout(resolve, 4000); })
              ]);
              if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              if (!force && registration.active) registration.active.postMessage({ type: 'CLEAR_RETIRED_CACHES' });
            }
          }
          if (force && !await verifiedNetworkShell()) throw new Error('Full Circle is not reachable yet.');
          if (force && registration) {
            var recoveryWorker = registration.active || registration.waiting || registration.installing;
            if (recoveryWorker) recoveryWorker.postMessage({ type: 'RESET_APP_SHELL' });
          }
          if ('caches' in window) {
            var cacheNames = await window.caches.keys().catch(function () { return []; });
            await Promise.all(cacheNames.filter(function (cacheName) {
              return cacheName.indexOf('full-circle-') === 0
                && (force || cacheName.indexOf(currentCachePrefix) !== 0);
            }).map(function (cacheName) {
              return window.caches.delete(cacheName);
            })).catch(function () {});
          }
        } catch (error) {
          repairStarted = false;
          if (retryButton) {
            retryButton.disabled = false;
            retryButton.textContent = 'Still reconnecting - Try Again';
          }
          return;
        }

        try {
          var freshUrl = new URL(window.location.href);
          freshUrl.searchParams.set(marker, release);
          freshUrl.searchParams.set('ts', String(Date.now()));
          if (force) window.location.replace(freshUrl.toString());
          else repairStarted = false;
        } catch (error) {
          repairStarted = false;
        }
      };

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('./fc-worker.js?v=178', { updateViaCache: 'none' })
          .then(function (registration) { return registration.update(); })
          .catch(function () {});
      }
      if (new URL(window.location.href).searchParams.get(marker) === release) {
        void window.__repairFullCircleBoot(false);
      }

      // If the page itself arrives but its application bundle is blocked by a
      // carrier or a partial CDN rollout, load that same immutable bundle from
      // an independent CDN. This keeps the user's session on the current
      // origin and avoids sending them through a second sign-in.
      window.__loadFullCircleMirror = function (failedSource) {
        if (mirrorStarted || !failedSource) return;
        var failedUrl = new URL(failedSource, window.location.href);
        var assetMarker = failedUrl.pathname.lastIndexOf('/assets/');
        if (assetMarker < 0) return;
        mirrorStarted = true;
        var assetPath = failedUrl.pathname.slice(assetMarker + 1);
        var mirrors = [
          'https://cdn.jsdelivr.net/gh/TNSorganization/Full-Circle@gh-pages/',
          'https://raw.githack.com/TNSorganization/Full-Circle/gh-pages/'
        ];
        var loadMirror = function (index) {
          if (index >= mirrors.length) {
            mirrorStarted = false;
            return;
          }
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = mirrors[index] + assetPath + '?fc-mirror=' + release;
          script.onload = function () { mirrorStarted = false; };
          script.onerror = function () {
            script.remove();
            loadMirror(index + 1);
          };
          document.head.appendChild(script);
        };
        loadMirror(0);
      };

      window.addEventListener('DOMContentLoaded', function () {
        window.setTimeout(function () {
          if (window.__fullCircleStylesReady) return;
          window.__loadFullCircleStyleMirror(
            document.querySelector('link[data-full-circle-release-styles]')
          );
        }, 6000);
      }, { once: true });
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-BIriMFmq.js" onerror="window.__loadFullCircleMirror(this.src)"></script>
  <link rel="modulepreload" crossorigin href="./assets/app-runtime-DpNgz4Wy.js">
  <link rel="stylesheet" href="./full-circle-release.css?v=178" data-full-circle-release-styles="true" onload="window.__markFullCircleStylesReady(this)" onerror="window.__loadFullCircleStyleMirror(this)">

  <script>
    // If an older phone cannot execute the application bundle, leave it a
    // usable recovery action instead of a permanent blank screen.
    window.__fullCircleBootWatchdog = window.setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.dataset.fcAppMounted === 'true') return;
      window.__showFullCircleRecovery();
    }, 30000);
  </script>
