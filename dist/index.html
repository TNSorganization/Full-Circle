  <!-- Release-aware recovery for installed and in-browser copies. -->
  <title>Full Circle</title>
  <script>
    // Keep recovery explicit. Automatic cache deletion and reloads made weak
    // mobile connections restart just as the application was about to open.
    (function () {
      var release = '115';
      var marker = 'fc-repair';
      var repairStarted = false;
      window.__fullCircleBootRelease = release;

      window.__repairFullCircleBoot = async function (force) {
        if (repairStarted) return;
        repairStarted = true;

        try {
          if ('serviceWorker' in navigator) {
            var registration = await navigator.serviceWorker.getRegistration().catch(function () { return null; });
            if (registration && registration.active) registration.active.postMessage({ type: 'WARM_APP_SHELL' });
            if (registration) await registration.update().catch(function () {});
          }
        } finally {
          var freshUrl = new URL(window.location.href);
          freshUrl.searchParams.set(marker, release);
          freshUrl.searchParams.set('ts', String(Date.now()));
          if (force) window.location.replace(freshUrl.toString());
          else repairStarted = false;
        }
      };

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('./sw.js?v=115', { updateViaCache: 'none' })
          .then(function (registration) { return registration.update(); })
          .catch(function () {});
      }
    })();
  </script>

  <script>
    // If an older phone cannot execute the application bundle, leave it a
    // usable recovery action instead of a permanent blank screen.
    window.__fullCircleBootWatchdog = window.setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.dataset.fcAppMounted === 'true') return;
      var bootRelease = window.__fullCircleBootRelease || '115';
      var emergencyUrl = 'https://cdn.jsdelivr.net/gh/TNSorganization/Full-Circle@gh-pages/?fc-origin-recovery=' + encodeURIComponent(window.location.hostname);
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0f2037;color:#fff;font:600 16px system-ui;text-align:center"><div><p>The connection is taking longer than usual.</p><button type="button" onclick="window.__repairFullCircleBoot(true)" style="margin-top:16px;border:0;border-radius:8px;padding:12px 18px;background:#ffd83d;color:#0f2037;font:800 14px system-ui">Retry Full Circle</button><p style="margin:14px 0 0;font-size:13px;color:#cbd5e1">Release ' + bootRelease + '</p><a href="' + emergencyUrl + '" style="display:inline-block;margin-top:8px;color:#ffd83d;font:800 14px system-ui">Open emergency copy</a></div></div>';
    }, 20000);
