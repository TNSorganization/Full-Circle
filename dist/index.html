  <script>
    // Repair a retired installed-app worker before it can keep serving stale
    // HTML or JavaScript. The release marker prevents a repair loop on a slow
    // connection, and the application registers the current worker after boot.
    (function () {
      var release = '106';
      var marker = 'fc-repair';
      var currentUrl = new URL(window.location.href);
      var repairStarted = false;

      window.__repairFullCircleBoot = async function (force) {
        if (repairStarted) return;
        if (!force && currentUrl.searchParams.get(marker) === release) return;
        repairStarted = true;

        try {
          if ('caches' in window) {
            var cacheNames = await window.caches.keys().catch(function () { return []; });
            await Promise.all(cacheNames.filter(function (cacheName) {
              return cacheName.indexOf('full-circle-') === 0;
            }).map(function (cacheName) {
              return window.caches.delete(cacheName);
            }));
          }
          if ('serviceWorker' in navigator) {
            var registrations = await navigator.serviceWorker.getRegistrations().catch(function () { return []; });

              return registration.scope === appScope;
            }).map(function (registration) {
              return registration.unregister();
            }));
          }
        } finally {
          var freshUrl = new URL(window.location.href);
          freshUrl.searchParams.set(marker, release);
          freshUrl.searchParams.set('ts', String(Date.now()));
          window.location.replace(freshUrl.toString());
        }
      };

      if ('serviceWorker' in navigator) {
        var controller = navigator.serviceWorker.controller;
        var currentWorker = controller && new RegExp('[?&]v=' + release + '(?:&|$)').test(controller.scriptURL);

          window.__repairFullCircleBoot(false);

        }

          .register('./sw.js?v=106', { updateViaCache: 'none' })
          .then(function (registration) { return registration.update(); })
          .catch(function () {});
      }
    })();

  <main id="root"></main>
  <script>
    // If an older phone cannot execute the application bundle, leave it a
    // usable recovery action instead of a permanent blank screen.
    window.__fullCircleBootWatchdog = window.setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.hasChildNodes()) return;
      var alreadyRepaired = new URL(window.location.href).searchParams.get('fc-repair') === '106';
      if (!alreadyRepaired && typeof window.__repairFullCircleBoot === 'function') {
        window.__repairFullCircleBoot(false);
        return;
      }
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0f2037;color:#fff;font:600 16px system-ui;text-align:center"><div><p>Full Circle needs a fresh start on this device.</p><button type="button" onclick="window.__repairFullCircleBoot(true)" style="margin-top:16px;border:0;border-radius:8px;padding:12px 18px;background:#ffd83d;color:#0f2037;font:800 14px system-ui">Repair and open app</button></div></div>';
