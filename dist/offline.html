<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f2037" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Offline — Full Circle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background: #131E34;
      color: #DDE3FF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .dove {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      animation: float 4s ease-in-out infinite;
    }
    h1 {
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #DDE3FF;
      margin-bottom: 0.5rem;
    }
    p {
      color: #8896CC;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 1rem;
      border: 1.5px solid rgba(221, 227, 255, 0.22);
      background: rgba(221, 227, 255, 0.10);
      color: #DDE3FF;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      background: rgba(221, 227, 255, 0.20);
      border-color: rgba(221, 227, 255, 0.34);
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #DC6A6A;
      margin-right: 0.5rem;
    }
    .status-dot.online {
      background: #6FBF92;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .container { animation: fadeIn 0.5s ease-out; }
  </style>
</head>
<body>
  <div class="container">
    <svg class="dove" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="256" cy="256" r="194" fill="#8EA5FF" opacity="0.16"/>
      <ellipse cx="342" cy="145" rx="53" ry="34" fill="#B5C0D8"/>
      <ellipse cx="304" cy="160" rx="34" ry="23" fill="#B5C0D8"/>
      <ellipse cx="378" cy="163" rx="27" ry="20" fill="#B5C0D8"/>
      <path d="M269 267C310 250 344 266 353 301C361 343 326 373 288 363C258 351 239 314 269 267Z" fill="#4A6B9E"/>
      <path d="M289 287C312 276 335 291 337 315C340 338 318 354 294 346C275 338 269 308 289 287Z" fill="#3A5680" opacity="0.6"/>
      <ellipse cx="252" cy="315" rx="86" ry="70" fill="white"/>
      <circle cx="191" cy="225" r="55" fill="white"/>
      <path d="M183 203C206 203 207 222 198 232C189 241 171 235 171 219C171 209 176 203 183 203Z" fill="#1A2438"/>
      <circle cx="195" cy="214" r="6" fill="white"/>
      <path d="M143 232L99 248L143 264Z" fill="#D4A05A"/>
      <path d="M143 232L99 248L143 264Z" stroke="#B88540" stroke-width="3"/>
      <path d="M211 263C226 200 281 190 310 217C321 233 313 256 288 267C250 283 211 285 211 263Z" fill="white"/>
      <path d="M225 263C244 221 281 207 300 231" stroke="#D0D8E8" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="274" cy="340" rx="54" ry="39" fill="#E8EDF5" opacity="0.6"/>
      <rect x="239" y="373" width="17" height="34" rx="5" fill="#4A6B9E"/>
      <path d="M231 407H264L247 418Z" fill="#3A5680"/>
      <ellipse cx="286" cy="389" rx="14" ry="9" fill="#3A5680" opacity="0.4"/>
    </svg>
    <h1>You're Offline</h1>
    <p>Full Circle needs an internet connection to load. Check your connection and try again.</p>
    <button class="retry-btn" onclick="recoverFullCircle()">
      <span class="status-dot"></span>
      Retry Connection
    </button>
    <p style="margin-top: 1rem; font-size: 0.8rem; color: #8896CC;">
      Some previously loaded content may still be available.
    </p>
  </div>
  <script>
    var RECOVERY_VERSION = '96';
    var recoveryInProgress = false;

    async function clearRetiredAppCaches() {
      if ('caches' in window) {
        var cacheNames = await window.caches.keys().catch(function() { return []; });
        await Promise.all(cacheNames.filter(function(cacheName) {
          return cacheName.indexOf('full-circle-') === 0;
        }).map(function(cacheName) {
          return window.caches.delete(cacheName);
        }));
      }
    }

    async function installRecoveryWorker() {
      if (!('serviceWorker' in navigator)) return;
      var registration = await navigator.serviceWorker.register(new URL('sw.js?v=' + RECOVERY_VERSION, window.location.href), { updateViaCache: 'none' });
      await registration.update().catch(function() {});
      if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
    }

    async function recoverFullCircle() {
      if (recoveryInProgress) return;
      recoveryInProgress = true;
      var button = document.querySelector('.retry-btn');
      button.innerHTML = '<span class="status-dot online"></span> Reconnecting...';
      try {
        await clearRetiredAppCaches();
        // Repair notifications in the background, but never make a healthy
        // network wait for a service-worker controller handoff. Some mobile
        // browsers delay that handoff even while the site is fully reachable.
        installRecoveryWorker().catch(function() {});
        var response = await fetch(new URL('index.html?fc-connectivity=' + RECOVERY_VERSION + '&ts=' + Date.now(), window.location.href), { cache: 'no-store' });
        if (!response.ok) throw new Error('Full Circle is not reachable yet.');
        var html = await response.text();
        if (html.indexOf('id="root"') === -1) throw new Error('The application shell is not ready yet.');
        window.location.replace(new URL('index.html?fc-recovered=' + RECOVERY_VERSION + '&ts=' + Date.now(), window.location.href));
      } catch (error) {
        recoveryInProgress = false;
        button.innerHTML = '<span class="status-dot"></span> Retry Connection';
      }
    }

    // A current notification-only worker replaces any retired worker that
    // served this fallback. It is never unregistered during recovery.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'FULL_CIRCLE_RECOVERY_READY') recoverFullCircle();
      });
    }

    // navigator.onLine is unreliable on installed mobile apps. Probe the
    // actual site and keep only one recovery attempt in flight.
    recoverFullCircle();
    setInterval(recoverFullCircle, 10000);

    // Update status dot when online
    window.addEventListener('online', function() {
      document.querySelector('.status-dot').classList.add('online');
      document.querySelector('.retry-btn').innerHTML = '<span class="status-dot online"></span> Back Online — Reloading...';
      recoveryInProgress = false;
      setTimeout(function() { recoverFullCircle(); }, 300);
    });
  </script>
</body>
</html>
